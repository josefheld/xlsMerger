[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsmerger"
version = "0.1.0"
description = "Tools to merge and normalize Excel files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "xlsMerger contributors" }
]
dependencies = [
  "openpyxl>=3.1",
  "xlrd>=2.0.1"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["dist", "xlsMerger.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
