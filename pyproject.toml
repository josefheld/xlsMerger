[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsmerger"
version = "0.1.0"
description = "Tools to merge and normalize Excel files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "xlsMerger contributors" }
]
dependencies = [
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "xlrd>=2.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.8",
  "xlwt>=1.3"
]

[project.scripts]
xlsmerger = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "profiles*"]
exclude = ["Originale*", "dist*", "tests*", "examples*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
